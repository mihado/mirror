name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    # Use disposable hosted runners for untrusted pull requests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned to the first uv release with webpki-root-certs 1.0.10, which drops the
          # compromised eMudhra root (INC-2436); any later release is safe.
          version: '0.13.4'
      - run: cargo install ripgrep --locked
      - run: bash ci.sh
  rust:
    # Use disposable hosted runners for untrusted pull requests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          # Keep the launcher check on the Python job's uv toolchain.
          version: '0.13.4'
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 install ripgrep --locked
      # Match the development test toolchain; upgrade with checkpoint tests.
      - run: cargo +1.95.0 install --locked jj-cli --version 0.43.0
      - uses: arduino/setup-protoc@v3
        id: protoc
        with:
          # Match the schema compiler used for release builds.
          version: '33.4'
      - run: |
          cargo +1.95.0 test --locked -p mirror-agent -p mirror-protocol
          ./mirror-cli/mirror-dev --help
        env:
          # mirror-dev must use the same compiler as the Rust checks.
          RUSTUP_TOOLCHAIN: '1.95.0'
          PROTOC: ${{ steps.protoc.outputs.path }}/bin/protoc
          PROTOBUF_WELL_KNOWN_TYPES: ${{ steps.protoc.outputs.path }}/include/google/protobuf/any.proto
