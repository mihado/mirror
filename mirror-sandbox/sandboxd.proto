syntax = "proto3";
package mirror.sandbox.v1;
import "protocols/mirror_agent/protos/agent.proto";

// buf:lint:ignore SERVICE_SUFFIX
service Sandboxd {
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc RunCommand(stream RunCommandRequest) returns (stream RunCommandResponse);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Egress(stream EgressUpdate) returns (stream EgressEvent);
}

message ExecuteRequest {
  string call_id = 1;
  uint64 timeout_millis = 2;
  uint64 max_output_bytes = 3;
  mirror.agent.v1.ToolCall call = 4;
}
message ExecuteEvent {
  oneof event {
    bool accepted = 1;
    ExecuteResponse completed = 2;
  }
}
message CancelRequest { string call_id = 1; }
message CancelResponse {}
message ExecuteResponse {
  oneof outcome {
    mirror.agent.v1.ChatRecord completed = 1;
    string rejected = 2;
    string failed = 3;
    bool cancelled = 4;
    bool deadline_exceeded = 5;
  }
}

message RunCommandStart {
  string call_id = 1;
  string command = 2;
  optional string workdir = 3;
  uint64 timeout_millis = 4;
}
message RunCommandRequest {
  oneof input {
    RunCommandStart start = 1;
    bytes stdin = 2;
  }
}
message RunCommandResponse {
  oneof event {
    bool accepted = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    RunCommandResult completed = 4;
  }
}
message RunCommandResult {
  oneof outcome {
    int32 exit_code = 1;
    string rejected = 2;
    string failed = 3;
    bool cancelled = 4;
    bool deadline_exceeded = 5;
  }
}

message EgressProxyConfig {
  string host = 1;
  uint32 port = 2;
  string ca_pem = 3;
  repeated GuestProfile profiles = 4;
  uint32 local_proxy_port = 5;
}
message GuestProfile {
  string name = 1;
  map<string, string> environment = 2;
  repeated GuestFile files = 3;
  repeated StaticEndpoint endpoints = 4;
}
message GuestFile {
  string path = 1;
  uint32 mode = 2;
  bytes contents = 3;
}
message StaticEndpoint {
  string listen = 1;
  repeated StaticRoute routes = 2;
  map<string, string> response_headers = 3;
}
message StaticRoute {
  string path = 1;
  map<string, string> required_headers = 2;
  uint32 status = 3;
  map<string, string> response_headers = 4;
  bytes body = 5;
}
message EgressIdentity {
  uint64 request_id = 1;
  uint64 expires_at = 2;
  bytes token = 3;
}
message EgressUpdate {
  oneof update {
    EgressProxyConfig configure = 1;
    EgressIdentity identity = 2;
  }
}
message EgressEvent {
  uint64 request_id = 1;
  bool installed = 2;
  GuestReady ready = 3;
}
message GuestReady {
  oneof outcome {
    bool ready = 1;
    string failed = 2;
  }
}
